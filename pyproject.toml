[project]
name = "between-the-cuffs"
version = "0.1.0"
description = "Pre-registered test: do heart rate and pleth waveform features improve a cuff-only next-reading MAP forecast after spinal anesthesia?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
# Exact pins of every package the code imports (SPEC §10). The lock file pins the rest.
dependencies = [
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "neurokit2==0.3.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pillow==13.0.0",
    "pyarrow==26.0.1",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "threadpoolctl==3.8.0",
    "vitaldb==1.7.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
# Exploratory encoder check only (ENCODER_PLAN.md §1): the CPU build of torch, from the index below.
encoder = ["torch==2.15.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
# The versions of the environment the analysis ran in, so that the lock resolves to them.
constraint-dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cloudpickle==3.1.3",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==4.3.0",
    "fonttools==4.68.0",
    "frozenlist==1.8.0",
    "fsspec==2026.9.0",
    "idna==3.20",
    "imageio==2.38.2",
    "iniconfig==2.3.1",
    "jinja2==3.1.6",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "markupsafe==3.0.4",
    "matplotlib==3.11.2",
    "mpmath==1.3.0",
    "multidict==7.2.1",
    "narwhals==2.29.0",
    "networkx==3.7",
    "neurokit2==0.3.0",
    "numpy==2.5.5",
